<!DOCTYPE html>
<html>
    <head>
        <title>Artist Profile - Hip-Hop Hub</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body class="profile-page">
       <header class="navbar">
           <div class="logo">Hip-Hop Hub</div>
           <nav class="nav-links">
               <a href="index.html">Home</a>
               <a href="index.html#artists">Artists</a>
               <a href="#albums">Albums</a>
               <a href="#songs">Songs</a>
               <a href="admin.html">Admin</a>
           </nav>
       </header>

       <div class="profile-container">
           <div class="profile-info"> 
               <img id="artistImage" src="" alt="artist" class="Profile">
               <h1 id="artistName" class="Name"></h1>
               <p id="artistBio" class="Bio"></p>
           </div>

           <div class="buttons">
               <button id="follow-button">Follow</button>
               <a id="instagram-button" href="" target="_blank">Instagram</a>
           </div>

           <hr>

           <h1>Popular</h1>
           <div class="popular-songs">
               <div class="albums">
                   <h2>Albums</h2>
                   <ul id="albumsList">
                       <!-- Albums will be populated by JavaScript -->
                   </ul>
               </div>
               <div class="hit-singles">
                   <h2>Hit Singles</h2>
                   <ul id="singlesList">
                       <!-- Singles will be populated by JavaScript -->
                   </ul>
               </div>
           </div>
       </div>

       <footer>
           <p>Hip-Hop Hub - Created by LODDYRB</p>   
       </footer>

       <script src="script.js"></script>
    </body>
</html>
