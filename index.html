<!DOCTYPE html>
<html>
    <head>
        <title>Hip-Hop Hub - Music Platform</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body class="home-page">
       <header class="navbar">
           <div class="logo">Hip-Hop Hub</div>
           <nav class="nav-links">
               <a href="index.html">Home</a>
               <a href="#artists">Artists</a>
               <a href="#albums">Albums</a>
               <a href="#songs">Songs</a>
           </nav>
       </header>

       <!-- Hero Section -->
       <section class="hero-section">
           <div class="hero-overlay"></div>
           <div class="hero-content">
               <h1 class="hero-title">Welcome to Hip-Hop Hub</h1>
               <p class="hero-subtitle">Discover the legends shaping the future of hip-hop</p>
               <button class="hero-cta" onclick="document.getElementById('explore').scrollIntoView({behavior: 'smooth'})">Explore Artists</button>
           </div>
       </section>

       <!-- Explore Section -->
       <div class="home-container" id="explore">
           <h1 class="home-title">Explore Hip-Hop Legends</h1>
           <p class="home-subtitle">Discover biographies and discographies of your favorite rappers and artists</p>
           
           <div class="artists-grid" id="artistsGrid">
               <!-- Artist cards will be generated by JavaScript -->
           </div>
       </div>

       <footer>
           <p>Hip-Hop Hub - Created by LODDYRB</p>   
       </footer>

       <script src="script.js"></script>3
    </body>
</html>
